function renderOrderSlots(){if(scene!=='order')return;['slot1','slot2'].forEach((id,i)=>{const e=$(id);if(e)e.innerHTML=order[i]?`<b>${i+1}.</b> ${matrixTools[order[i]].symbol} ${matrixTools[order[i]].name}`:`${i+1===1?'① 最初':'② 次'}の装置`});document.querySelectorAll('[data-tool]').forEach(e=>e.classList.toggle('used',order.includes(e.dataset.tool)));const label=$('orderStatus');if(label){if(order.length===0)label.textContent='装置を2つ選ぼう';else if(order.length===1)label.textContent='あと1つ装置を選ぼう';else{const end=orderResult();label.textContent=`結果：(${end.x}, ${end.y}) ${end.x===-1&&end.y===2?'✓ 灯りに届いた！':'— 届かない'}`;label.classList.toggle('ok',end.x===-1&&end.y===2)}}}
function foldState(){const d=Math.hypot(r.x-b.x,r.y-b.y),center={x:(r.x+b.x)/2,y:(r.y+b.y)/2},at=Math.hypot(center.x-.55,center.y-1.02)<.27;return{near:d<.25,at,center,d,win:d<.25&&at}}
function midState(){const G=plus(b,mul(r,0)),Y=plus(b,mul(r,2)),P=plus(b,r);const left=Math.hypot(G.x+1.65,G.y-.85)<.83,right=Math.hypot(Y.x-1.65,Y.y-.85)<.83,safe=Math.hypot(P.x-0,P.y-1.6)<.48&&Math.hypot(P.x,P.y-.85)>.55;return{G,Y,P,left,right,safe,win:left&&right&&safe}}
function mul(p,n){return{x:p.x*n,y:p.y*n}}function plus(a,b){return{x:a.x+b.x,y:a.y+b.y}}
function apply(A,p){return{x:A[0][0]*p.x+A[0][1]*p.y,y:A[1][0]*p.x+A[1][1]*p.y}}
function orderResult(){let p={x:1,y:1};order.forEach(id=>p=apply(matrixTools[id].mat,p));return p}
function refreshMath(){const box=$('mathbox');if(!box||box.classList.contains('hidden'))return;let html='';if(stage===0){let f=foldState();html=`<h3>✦ 同じ場所に写すには？</h3>2つの光の座標は A(1,0) と A(0,1)。つまり行列Aの2本の列ベクトルが、光の位置になる。<pre>A = [ ${r.x.toFixed(2)}   ${b.x.toFixed(2)} ]\n    [ ${r.y.toFixed(2)}   ${b.y.toFixed(2)} ]</pre>両方が重なると det(A) ≈ 0。空間の一方向がつぶれる（ランクが下がる）。現在の det = ${(r.x*b.y-b.x*r.y).toFixed(2)}。`}
else if(stage===1){html=`<h3>✦ 変換の順番</h3>ひねる S=[1 1; 0 1]、まわす R=[0 -1; 1 0]、うつす M=[-1 0; 0 1]。<br>例えば S の後に R を使うと R·S、逆の順なら S·R。一般に R·S ≠ S·R。<pre>出発 (1,1) → ${order.length?orderResult().x:'?'} , ${order.length?orderResult().y:'?'}</pre>装置は2つ、使う順番は左から右。`}
else{let m=midState();html=`<h3>✦ いつも真ん中にいる</h3>緑 = b、紫 = r+b、黄 = 2r+b。<br>どんな行列Aでも「紫=(緑+黄)/2」が成り立つ。2匹の位置が決まると、紫ちゃんの居場所も自動的に決まる。<pre>紫 (${m.P.x.toFixed(2)}, ${m.P.y.toFixed(2)})\n緑 (${m.G.x.toFixed(2)}, ${m.G.y.toFixed(2)})\n黄 (${m.Y.x.toFixed(2)}, ${m.Y.y.toFixed(2)})</pre>この関係を利用して、全員が気持ちよい場所を探そう。`}
box.innerHTML=html}
function hint(){hintLevel++;let msg='';if(stage===0){msg=hintLevel===1?'光の欠片は、赤と青の先端と一緒に動いているよ。': '2本の先端を、同じ金色の輪の中まで持っていこう。空間を「つぶす」のがコツ。'}else if(stage===1){msg=hintLevel===1?'同じ装置でも、1番目と2番目を交換すると結果が変わるよ。':'「ながす」を先に、「まわす」を後に使ってみよう。'}else{msg=hintLevel===1?'紫ちゃんは、緑の子と黄色い子のちょうど真ん中にいるよ。':'まず左右の子をそれぞれの広い場所へ。そのまま2匹を上の方に少し動かすと、真ん中の紫ちゃんも池を避けられる。'}toast(msg)}
function checkSuccess(){if(successFired||scene==='garden')return;if(stage===0){let f=foldState();if(f.win)win()}
if(stage===1){if(order.length===2){let e=orderResult();if(e.x===-1&&e.y===2)win()}}
if(stage===2){let m=midState();if(m.win)win()}}

note(['rank','order','midpoint'][stage]);const ss=['離れた光が、一つの輝きになった。','光が、橋の向こうまで届いた。','みんなが、安全な場所に集まれた。'];stageMessage=ss[stage];burstAt(stage===0?pos(foldState().center):stage===1?pos({x:-1,y:2}):pos(midState().P),60);setTimeout(()=>{
if(scene==='garden')return;let desc=stage===0?'別々の光を重ねるために、空間の一方向を折りたたんだ。橋に最初の灯りがともった。':stage===1?'装置の順番を変えると、行き先も変わった。2つ目の灯りが橋を照らす。':'紫ちゃんは、ふたりのちょうど真ん中。みんなの居場所を考えたら、橋の最後の灯りが戻った！';if(mode==='practice')desc+='（これは実験なので、庭の進行は変わらないよ）';overlay(`<div class="orb">✦</div><div class="eyebrow">${stage===2?'THE BRIDGE IS ALIVE':'A LITTLE DISCOVERY'}</div><h2>${stageMessage}</h2><p>${desc}</p><div class="mathread">${['発見：ランクと重なり','発見：行列の順序','発見：一次結合と中点'][stage]}</div><button class="btn primary" data-act="home">${stage===2?'みんなの庭へ帰る ♡':'庭へ帰る →'}</button>`)} ,1000)}
function resize(){const box=canvas.getBoundingClientRect();viewW=box.width;viewH=box.height;dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(viewW*dpr);canvas.height=Math.round(viewH*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function space(){return{ox:viewW*.5,oy:viewH*.62,sc:Math.min(viewW/7.9,viewH/7.7)}}
function pos(v){const s=space();return{x:s.ox+v.x*s.sc,y:s.oy-v.y*s.sc}}
function fromPos(x,y){const s=space();return{x:Math.max(-3.5,Math.min(3.5,(x-s.ox)/s.sc)),y:Math.max(-3.3,Math.min(3.5,(s.oy-y)/s.sc))}}
function pointerCoords(ev){const rect=canvas.getBoundingClientRect();return{x:ev.clientX-rect.left,y:ev.clientY-rect.top}}
canvas.addEventListener('pointerdown',e=>{const p=pointerCoords(e);if(scene==='garden'){let px=viewW*.3,py=viewH*.75;if(Math.hypot(px-p.x,py-p.y)<68){toast(saved.progress===3?'紫ちゃん「橋がつながって、うれしい！」':'紫ちゃん「向こうの子に、会いたいな…」');sound('tap');burstAt(p,15)}else if(saved.progress>=3&&Math.hypot(viewW*.66-p.x,viewH*.73-p.y)<70){toast('黄色い子「いっしょに遊ぼう！」');sound('tap')}return}
if(scene==='fold'||scene==='middle'){let rr=pos(r),bb=pos(b),d1=Math.hypot(rr.x-p.x,rr.y-p.y),d2=Math.hypot(bb.x-p.x,bb.y-p.y);if(Math.min(d1,d2)<35){drag=d1<=d2?'r':'b';canvas.setPointerCapture(e.pointerId);view.classList.add('drag');vibrate();sound('tap')}}});
canvas.addEventListener('pointermove',e=>{if(!drag)return;const p=pointerCoords(e),v=fromPos(p.x,p.y);if(drag==='r')r=v;else b=v;refreshGoals();refreshMath();checkSuccess()});
for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,()=>{drag=null;view.classList.remove('drag')});
function refreshGoals(){if(scene==='fold'||scene==='middle'){let a=scene==='fold'?foldState():midState();let c=panel.querySelectorAll('.goalchip');if(c.length){const flags=stage===0?[a.near,a.at]:[a.left,a.right,a.safe];c.forEach((e,i)=>{e.classList.toggle('ok',!!flags[i]);let s=e.textContent||'';e.textContent=(flags[i]?'✓':'○')+s.replace(/^[✓○]\s*/, ' ')})}}}
panel.addEventListener('click',e=>{const tool=e.target.closest('[data-tool]');if(tool&&scene==='order'){const id=tool.dataset.tool;if(order.length>=2)order=[];if(order.includes(id)){toast('同じ装置は一度だけ使えるよ');return}order.push(id);tries++;sound('tap');renderOrderSlots();refreshMath();checkSuccess();if(order.length===2&&!successFired){setTimeout(()=>toast('届かなかった… ほかの組み合わせも試してみよう'),450)}return}const stageEl=e.target.closest('[data-stage]');if(stageEl){beginStage(+stageEl.dataset.stage,true);return}const act=e.target.closest('[data-act]')?.dataset.act;if(!act)return;switch(act){case'start':beginStage(Math.min(2,saved.progress),saved.progress>=3);break;case'book':openBook();break;case'back':enterGarden();break;case'reset':beginStage(stage,mode==='practice');break;case'clearorder':order=[];renderOrderSlots();refreshMath();break;case'hint':hint();break;case'math':$('mathbox')?.classList.toggle('hidden');refreshMath();break}});

function roundRect(x,y,w,h,rad){ctx.beginPath();ctx.roundRect(x,y,w,h,rad)}
function circ(x,y,r,fill,alpha=1){ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,Math.max(.1,r),0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.globalAlpha=1}
function glow(x,y,rad,col,intensity=.7){let g=ctx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,col);g.addColorStop(.3,hexAlpha(col,intensity*.42));g.addColorStop(1,hexAlpha(col,0));ctx.fillStyle=g;ctx.fillRect(x-rad,y-rad,rad*2,rad*2)}
function hexAlpha(col,a){if(col.startsWith('#')){let c=col.slice(1);if(c.length===3)c=c.split('').map(k=>k+k).join('');return`rgba(${parseInt(c.slice(0,2),16)},${parseInt(c.slice(2,4),16)},${parseInt(c.slice(4,6),16)},${a})`}return col}
function line(a,b,col,width=2,alpha=1,dash=[]){ctx.save();ctx.strokeStyle=col;ctx.globalAlpha=alpha;ctx.lineWidth=width;ctx.lineCap='round';ctx.setLineDash(dash);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}
function ellipse(x,y,rx,ry,col,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2);ctx.fill();ctx.restore()}
function setBg(garden=false){const g=ctx.createLinearGradient(0,0,0,viewH);g.addColorStop(0,'#09182d');g.addColorStop(.52,garden?'#173d4b':'#112a46');g.addColorStop(1,garden?'#16382d':'#102637');ctx.fillStyle=g;ctx.fillRect(0,0,viewW,viewH);glow(viewW*.68,viewH*.19,viewW*.55,garden?'#719778':'#5879b9',.24);stars.forEach((s,i)=>{let x=s.x*viewW,y=(s.y*.8+.015)*viewH,tw=.48+.38*Math.sin(frame*.025+s.tw);circ(x,y,s.rad, i%8===0?'#ffeab5':'#c6d9fb',tw)})}
function drawFloor(){let h=viewH,w=viewW;ctx.fillStyle='#244834';ctx.beginPath();ctx.moveTo(0,h*.67);ctx.bezierCurveTo(w*.3,h*.59,w*.66,h*.8,w,h*.66);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();ctx.fillStyle='#204031';ctx.beginPath();ctx.moveTo(0,h*.79);ctx.bezierCurveTo(w*.42,h*.72,w*.61,h*.88,w,h*.79);ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.fill();for(let i=0;i<55;i++){const x=(i*53.67%w),y=h*(.73+(i*17.33%24)/100);line({x,y},{x:x+2,y:y-3},i%3===0?'#638968':'#517f61',.8,.6)}
let rg=ctx.createLinearGradient(w*.43,0,w*.63,0);rg.addColorStop(0,'#1b5760');rg.addColorStop(.5,'#225879');rg.addColorStop(1,'#1a4d66');ctx.fillStyle=rg;ctx.beginPath();ctx.moveTo(w*.42,h*.64);ctx.bezierCurveTo(w*.55,h*.69,w*.49,h*.85,w*.43,h);ctx.lineTo(w*.69,h);ctx.bezierCurveTo(w*.7,h*.82,w*.67,h*.69,w*.59,h*.62);ctx.closePath();ctx.fill();for(let i=0;i<15;i++){let yy=h*(.68+i*.023),xx=w*(.51+Math.sin(i*.75)*.024);line({x:xx-17,y:yy},{x:xx+17,y:yy-1},'#90e9eb',.9,.13+.08*Math.sin(frame*.035+i))}}

function drawFlower(x,y,s=1,lit=false){ctx.save();ctx.translate(x,y);ctx.scale(s,s);line({x:0,y:0},{x:1,y:-23},'#89c99e',2);ellipse(-8,-11,8,4,'#5d9a6f');ellipse(7,-7,8,4,'#69b587');if(lit)glow(0,-28,36,'#f4da9e',.7);for(let i=0;i<5;i++){let ang=i*Math.PI*2/5+frame*.0015;ellipse(Math.cos(ang)*9,-28+Math.sin(ang)*9,7,7,lit?'#f3dbbd':'#96b0ac',lit?1:.65)}circ(0,-28,5,lit?'#fff7be':'#a4b8c1');ctx.restore()}

function drawJelly(x,y,size,col,t=0,face=true){const key=col===C.purple?'purple':col===C.yellow?'yellow':col===C.mint?'mint':'purple',sprite=spriteImgs[key];if(sprite&&sprite.complete&&sprite.naturalWidth){ctx.save();const bob=Math.sin(frame*.032+t)*2.5;ctx.translate(x,y+bob);let squash=1+Math.sin(frame*.036+t)*.022;ctx.scale(1/squash,squash);glow(0,0,size*2,col,.25);ellipse(0,size*.56,size*.72,size*.14,'#050f20',.3);ctx.drawImage(sprite,-size*1.02,-size*1.1,size*2.04,size*2.04);ctx.restore();return;}let w=size,h=size*1.06;ctx.save();ctx.translate(x,y+Math.sin(frame*.032+t)*2.2);let squash=1+Math.sin(frame*.035+t)*.025;ctx.scale(1/squash,squash);glow(0,0,w*1.35,col,.65);ellipse(0,h*.54,w*.58,h*.12,'#06182a',.35);const g=ctx.createRadialGradient(-w*.32,-h*.37,1,0,0,w*1.05);g.addColorStop(0,'#fff7f6');g.addColorStop(.16,hexAlpha(col,.9));g.addColorStop(.67,hexAlpha(col,.78));g.addColorStop(1,hexAlpha(col,.28));ctx.fillStyle=g;ctx.strokeStyle=hexAlpha(col,.8);ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(-w*.76,h*.2);ctx.bezierCurveTo(-w*.83,-h*.55,-w*.32,-h*.86,w*.22,-h*.8);ctx.bezierCurveTo(w*.95,-h*.73,w*.89,-h*.11,w*.71,h*.34);ctx.bezierCurveTo(w*.52,h*.76,-w*.55,h*.7,-w*.76,h*.2);ctx.closePath();ctx.fill();ctx.stroke();ctx.save();ctx.globalAlpha=.45;ctx.strokeStyle='#fff';ctx.lineWidth=1.9;ctx.beginPath();ctx.moveTo(-w*.53,-h*.32);ctx.bezierCurveTo(-w*.44,-h*.61,-w*.22,-h*.65,-w*.03,-h*.66);ctx.stroke();ctx.restore();for(let i=0;i<6;i++){circ(Math.sin(i*2.1+t)*w*.42,Math.cos(i*1.9+t)*h*.34,Math.max(.6,w*.025),i%2===0?'#fff7ce':'#fff',.42)}if(face){let yy=-h*.13;circ(-w*.22,yy,w*.075,'#263754');circ(w*.2,yy,w*.075,'#263754');circ(-w*.24,yy-w*.02,w*.024,'#ffffff');circ(w*.18,yy-w*.02,w*.024,'#ffffff');ctx.strokeStyle='#465270';ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(0,yy+h*.12,w*.065,0,Math.PI);ctx.stroke()}ctx.restore()}
function drawGarden(){const w=viewW,h=viewH;setBg(true);drawFloor();drawHouse(w*.24,h*.58,Math.min(.95,w/410));drawBridge(saved.progress);for(let i=0;i<18;i++){let x=w*(.05+(i*47.1%90)/100),y=h*(.74+(i*15%22)/100);if(x>w*.43&&x<w*.7)continue;circ(x,y,2+i%2,i%4?'#6e9e77':'#f1d9b0',.6)}drawFlower(w*.18,h*.84,1,saved.progress>=1);drawFlower(w*.79,h*.91,.78,saved.progress>=2);if(saved.progress>=3)drawFlower(w*.31,h*.94,.9,true);glow(w*.71,h*.43,75,'#ecc9e1',.22);circ(w*.72,h*.38,15,'#fff0ba',.75);circ(w*.72,h*.38,12,'#f8e2ad',.8);drawJelly(w*.3,h*.75,30,C.purple,.5);drawJelly(saved.progress>=3?w*.6:w*.79,saved.progress>=3?h*.74:h*.67,26,C.yellow,2.5);if(saved.progress>=2)drawJelly(w*.18,h*.84,20,C.mint,1.5);for(let i=0;i<13;i++){let d=deco[i];let x=w*(.08+.83*d.x),y=h*(.37+.46*d.y);if(i%3===0)glow(x,y,9,'#efdca0',.25);circ(x,y,1.3,'#f4f0c0',.25+.27*Math.sin(frame*.034+d.tw))}
if(saved.progress<3){let yy=h*.51+Math.sin(frame*.025)*3;ctx.fillStyle='#dceabf';ctx.font='11px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText('…',w*.3,yy)}else{for(let i=0;i<7;i++){let ang=i*.9+frame*.012;circ(w*.47+Math.sin(ang)*21,h*.67+Math.cos(ang)*10,1.6,'#fff9c6',.5)}}}
function gridBg(){setBg(false);const w=viewW,h=viewH;ctx.save();ctx.strokeStyle='#6d96af';ctx.globalAlpha=.13;ctx.lineWidth=.75;const s=space();for(let k=-6;k<=6;k++){let y=s.oy-k*s.sc,x=s.ox+k*s.sc;line({x:0,y},{x:w,y},'#8ba5c3',.6,.26);line({x,y:0},{x,y:h},'#8ba5c3',.6,.26)}ctx.restore();glow(w*.5,h*.52,w*.65,'#b6a0ee',.12);ctx.strokeStyle='#88acd2';ctx.lineWidth=1;ctx.globalAlpha=.17;ctx.beginPath();ctx.ellipse(w*.5,h*.59,w*.48,h*.38,0,0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1}
function warpedGrid(){ctx.save();ctx.globalAlpha=.22;for(let i=-3;i<=3;i++){let p1=pos(plus(mul(r,i),mul(b,-3))),p2=pos(plus(mul(r,i),mul(b,3)));line(p1,p2,'#8aaccb',.85,.7);p1=pos(plus(mul(r,-3),mul(b,i)));p2=pos(plus(mul(r,3),mul(b,i)));line(p1,p2,'#8aaccb',.85,.7)}ctx.restore()}
function handle(v,col,label){const p=pos(v),o=pos({x:0,y:0});line(o,p,col,4,.68);let a=Math.atan2(p.y-o.y,p.x-o.x);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-12*Math.cos(a-.48),p.y-12*Math.sin(a-.48));ctx.lineTo(p.x-12*Math.cos(a+.48),p.y-12*Math.sin(a+.48));ctx.fill();glow(p.x,p.y,31,col,.58);circ(p.x,p.y,12,'#172a42');ctx.save();ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();ctx.arc(p.x,p.y,12,0,Math.PI*2);ctx.stroke();ctx.restore();circ(p.x,p.y,5,'#f9fcff');ctx.font='bold 10px -apple-system,sans-serif';ctx.fillStyle='#e4f4ff';ctx.textAlign='center';ctx.fillText(label,p.x,p.y+28)}
function portalRing(v,rad,col='#f6da9c',intensity=1){const p=pos(v);glow(p.x,p.y,rad*2.6,col,.35*intensity);ctx.save();ctx.strokeStyle=col;ctx.lineWidth=2.2;ctx.globalAlpha=.65*intensity;ctx.setLineDash([3,7]);ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.stroke();ctx.restore();circ(p.x,p.y,rad*.22,col,.6*intensity)}
function drawShard(v,col,i){const p=pos(v);glow(p.x,p.y,31,col,.45);let rr=9+Math.sin(frame*.07+i)*1.7;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(frame*.01+i);ctx.beginPath();ctx.moveTo(0,-rr);ctx.lineTo(rr*.74,0);ctx.lineTo(0,rr);ctx.lineTo(-rr*.74,0);ctx.closePath();ctx.fillStyle=col;ctx.globalAlpha=.9;ctx.fill();ctx.globalAlpha=1;ctx.strokeStyle='#fffbe0';ctx.stroke();ctx.restore()}
function drawFold(){gridBg();warpedGrid();portalRing({x:.55,y:1.02},19,'#f7d9ab');const a=foldState(),goal=pos({x:.55,y:1.02});line(pos(r),pos(b),'#d2c6ed',1.5,.45,[3,6]);if(a.d<1.5)glow(a.center?pos(a.center).x:goal.x,a.center?pos(a.center).y:goal.y,65,'#ffedb0',Math.max(0,.95-a.d/1.5));drawShard(r,'#ffa5b3',1);drawShard(b,'#8cddff',2);const purple=pos(plus(r,b));drawJelly(purple.x,purple.y,14,C.purple,.6);handle(r,C.red,'赤');handle(b,C.blue,'青');const mid=pos(a.center);if(a.d<.5){glow(mid.x,mid.y,55,'#ffe7a4',.6);circ(mid.x,mid.y,5,'#fff7d2')}ctx.font='10px -apple-system,sans-serif';ctx.fillStyle='#c3d1e4';ctx.textAlign='center';ctx.fillText('2つの光を重ねる',viewW*.5,viewH*.25);$('scenePrompt').textContent=a.win?'橋に光が流れ込む…':a.near?'重なった！ そのまま金色の輪へ':'赤と青の端をドラッグして、光を重ねよう'}
function drawOrder(){gridBg();const s=space(),start={x:1,y:1},p0=pos(start),target=pos({x:-1,y:2});glow(target.x,target.y,70,'#ffe6a8',.6);portalRing({x:-1,y:2},19,'#f9dca6');ctx.textAlign='center';ctx.fillStyle='#ffeccc';ctx.font='bold 11px -apple-system,sans-serif';ctx.fillText('灯台',target.x,target.y-31);drawJelly(p0.x,p0.y,15,C.purple,1);ctx.font='10px -apple-system,sans-serif';ctx.fillStyle='#b2d4e9';ctx.fillText('はじまり',p0.x,p0.y+35);let curr=start;const cols=['#8cddff','#f9c99e'];order.forEach((id,i)=>{let next=apply(matrixTools[id].mat,curr);line(pos(curr),pos(next),cols[i],3,.9);let x=pos(next);glow(x.x,x.y,34,cols[i],.4);circ(x.x,x.y,i===order.length-1?9:6,cols[i],.85);ctx.fillStyle='#f3f8ff';ctx.font='bold 11px -apple-system,sans-serif';ctx.fillText(i+1,x.x,x.y-15);curr=next});const c=pos(curr);if(order.length===2){drawJelly(c.x,c.y,16,C.purple,.2);if(c.x!==target.x||c.y!==target.y){ctx.fillStyle='#bdd4df';ctx.font='11px -apple-system,sans-serif';ctx.fillText('ここに来た',c.x,c.y+37)}}$('scenePrompt').textContent=order.length===0?'下から装置をタップして、順番を作ろう':order.length===1?'次に使う装置を選んでね':orderResult().x===-1&&orderResult().y===2?'光が灯台に届いた！':'違うところに着いた。順番を変えてみよう'}
function region(v,rad,col,label,alpha=.2){let p=pos(v),s=space();glow(p.x,p.y,rad*s.sc*1.5,col,.15);ellipse(p.x,p.y,rad*s.sc,rad*s.sc,hexAlpha(col,alpha));ctx.save();ctx.strokeStyle=col;ctx.lineWidth=1.8;ctx.setLineDash([4,5]);ctx.beginPath();ctx.arc(p.x,p.y,rad*s.sc,0,Math.PI*2);ctx.stroke();ctx.restore();ctx.font='11px -apple-system,sans-serif';ctx.fillStyle=col;ctx.textAlign='center';ctx.fillText(label,p.x,p.y-rad*s.sc-10)}

function burstAt(p,n=30){for(let i=0;i<n;i++){const ang=i*2.399,spd=.4+(i%8)*.35;fx.push({x:p.x,y:p.y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-1,age:0,life:36+i%36,c:i%3===0?'#ffddb3':i%3===1?'#d0f8e3':'#d9c1ff'})}}

function render(){frame++;ctx.clearRect(0,0,viewW,viewH);if(scene==='garden')drawGarden();else if(scene==='fold')drawFold();else if(scene==='order')drawOrder();else drawMiddle();drawFx();requestAnimationFrame(render)}
