<body><main id="app">
<header><div><div class="kicker">HIKARI NO SUMIKA • PLAYTEST</div><h1>ひかりの回廊 <span style="color:#98d9eb;font-size:12px">LAB 0–5</span></h1></div><div class="header-right"><span id="doneCount" class="chip">0 / 6 発見</span><button id="gardenBtn" class="ghost">庭へ</button></div></header>
<nav id="levels" aria-label="すべての数学レベルを選ぶ"></nav>
<div id="stageIntro"><div><div id="stageName"></div><div id="stageSubtitle"></div></div><div id="stageCount" class="progress"></div></div>
<section id="gameFrame"><canvas id="game" aria-label="数学で変形するランナーゲーム。下の操作パネルまたは赤と青の基底ハンドルで操作"></canvas><div class="topOverlay"><div class="glass" id="scoreGlass"></div><div class="glass" id="mathGlass"></div></div><div id="hintBubble" class="hintBubble"></div></section>
<div id="brief"><div id="briefText"></div><div id="quickBtns"><button class="ghost" id="pauseBtn">一時停止</button><button class="ghost" id="retryBtn">やり直す</button></div></div>
<section id="controls"><div id="controlHeader"><b id="controlTitle"></b><span id="controlInfo"></span></div><div id="controlBody"></div><div id="formula" class="formula"></div><div id="feedback" class="status"></div></section>
<div id="bottomNav"><span>全レベル開放中 • 失敗してもペナルティなし</span><button id="guideBtn">あそびかた・設計の意図</button></div>
</main><div id="modal" class="hide"><div class="modalCard"><div class="bigIcon" id="modalIcon">✨</div><h2 id="modalTitle"></h2><p id="modalText"></p><div id="modalBtns" class="modalBtns"></div></div></div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), cvs=$('game'),g=cvs.getContext('2d');const W=390,H=450,CX=195,CY=302,TAU=2*Math.PI;
const chapters=[
 {name:'形を知る',brief:'縦長・斜め・横長の裂け目が迫る。紫ちゃん自身の輪郭を変えて通り抜けよう。',sub:'LEVEL 0 · 形を変えるチュートリアル',tip:'最初は「縦長」を押してみよう。赤・青の点も指で動かせる。',symbol:'◇'},
 {name:'影になる',brief:'行列式を0にして、からだを1本の光へ。裂け目の向きに合わせ、光の実では元の姿へ。',sub:'LEVEL 1 · 行列式 0 / ランク1',tip:'「影・横」で最初の裂け目に入ろう。光の実は影のままだと吸収できない。',symbol:'━'},
 {name:'大きさを使う',brief:'広がると光を集められる。でも大きすぎると狭い壁を通れない。',sub:'LEVEL 2 · 行列式と面積',tip:'最初は大きく広げて光を受け、次の壁では小さくなる。',symbol:'▣'},
 {name:'流れを操る',brief:'光の粒子と危険な粒子が流れてくる。収束と回転のバランスで光を5つ集めよう。',sub:'LEVEL 3 · ベクトル場 / 発散 / 回転',tip:'「吸い寄せる」で光を集める。危険な粒子が来たら渦や押し出しを試そう。',symbol:'↺'},
 {name:'順番の魔法',brief:'伸ばしてから回す？ 回してから伸ばす？ 順番だけで通れる穴が変わる。',sub:'LEVEL 4 · 行列積 BA と AB',tip:'まず「伸ばす → 回す」を選ぶ。次の横長の穴では逆順にしよう。',symbol:'⧉'},
 {name:'未来の形',brief:'同じ行列が3回作用する。1回後・2回後・3回後の姿を想像して、3つの門を抜けよう。',sub:'LEVEL 5 · 固有値 / 固有ベクトル / Aⁿ',tip:'横方向は少しずつ伸び、縦方向は縮むと突破できそう。予測図を見てから発進。',symbol:'∞'}
];
const tasks={
 0:[{type:'gate',hw:18,hh:48,angle:0,title:'縦の裂け目',how:'幅を細く、縦長に'},{type:'gate',hw:18,hh:48,angle:Math.PI/4,title:'斜めの裂け目',how:'細長いまま45°ほど傾けよう'},{type:'gate',hw:47,hh:17,angle:0,title:'横の裂け目',how:'横長に形を変える'}],
 1:[{type:'shadow',hw:54,hh:3.6,angle:0,title:'水平のすきま',how:'行列式を0にして水平の影へ'},{type:'harvest',minDet:.52,minX:21,title:'光の実',how:'1次元の影では吸収できない。元の形に戻ろう'},{type:'shadow',hw:54,hh:3.6,angle:-Math.PI/4,title:'斜めのすきま',how:'影を45°傾ける'},{type:'harvest',minDet:.52,minX:21,title:'二つ目の光',how:'もう一度2次元へ復元する'}],
 2:[{type:'harvest',minDet:1.55,minX:34,title:'大きな光の雲',how:'面積を1.55倍以上に広げよう'},{type:'gate',hw:20,hh:19,angle:0,title:'狭い入口',how:'2方向とも縮める'},{type:'harvest',minDet:1.55,minX:34,title:'広がる光の雲',how:'もう一度大きく広げて回収'},{type:'gate',hw:19,hh:20,angle:0,title:'庭へ戻る小穴',how:'小さくなって帰還'}],
 4:[{type:'gate',hw:16,hh:49,angle:0,title:'縦長の門',how:'伸ばしてから回す'},{type:'gate',hw:51,hh:16,angle:0,title:'横長の門',how:'回してから伸ばす'},{type:'gate',hw:16,hh:49,angle:0,title:'最後の縦長の門',how:'また順番を入れ替える'}],
 5:[{type:'echo',n:1,hw:39,hh:24,minX:0,title:'第1の門',how:'まずは普通の幅で通ろう'},{type:'echo',n:2,hw:54,hh:19,minX:41,title:'第2の門',how:'2回作用した後は光を受け取るための幅も必要'},{type:'echo',n:3,hw:76,hh:13,minX:54,title:'第3の門',how:'3回後には横長で薄くなる必要がある'}]
};
const M={mul:(a,b)=>[a[0]*b[0]+a[1]*b[2],a[0]*b[1]+a[1]*b[3],a[2]*b[0]+a[3]*b[2],a[2]*b[1]+a[3]*b[3]],id:()=>[1,0,0,1],det:a=>a[0]*a[3]-a[1]*a[2],rot:t=>[Math.cos(t),-Math.sin(t),Math.sin(t),Math.cos(t)],diag:(x,y)=>[x,0,0,y],shear:k=>[1,k,0,1],pow:(a,n)=>{let out=M.id();for(let i=0;i<n;i++)out=M.mul(a,out);return out}};
const saved=(()=>{try{return JSON.parse(localStorage.getItem('morph-spectrum-progress-v1'))||{cleared:[],light:0}}catch(e){return {cleared:[],light:0}}})();
const s={lv:0,scene:'garden',started:false,paused:false,blocked:false,blockedUntil:0,idx:0,current:null,progress:0,t:0,ambientT:0,A:M.id(),sx:1,sy:1,theta:0,shear:0,fieldA:0,fieldB:0,particles:[],fieldCollected:0,fieldHazards:0,fieldSpawnTime:0,fieldTotal:0,fieldDuration:0,order:'SR',lambda1:1,lambda2:1,axis:0,echoRunning:false,echoCurrentN:0,shards:[],collectedAt:null,guideShown:false,drag:null,mouse:null,slow:1,frame:0,hintGen:0,runId:0,directA:null};
let activeModal=null,resizeObserver=null;
function save(){try{localStorage.setItem('morph-spectrum-progress-v1',JSON.stringify(saved))}catch(e){}}
function fmt(n){return (Math.abs(n)<.005?0:n).toFixed(2)}
function ellipseExtents(A,angle=0){let X=0,Y=0,coords=[];const c=Math.cos(angle),v=Math.sin(angle);for(let i=0;i<64;i++){const t=TAU*i/64,x=26*Math.cos(t),y=27*Math.sin(t);const xx=A[0]*x+A[1]*y, yy=A[2]*x+A[3]*y;const rx=c*xx+v*yy,ry=-v*xx+c*yy;X=Math.max(X,Math.abs(rx));Y=Math.max(Y,Math.abs(ry));coords.push([xx,yy])}return {x:X,y:Y,coords}}
function getA(){if(s.directA&&s.lv<=2)return s.directA;if(s.lv===4){const S=M.diag(1.84,.49),R=M.rot(Math.PI/2);return s.order==='SR'?M.mul(R,S):M.mul(S,R)}if(s.lv===5){const R=M.rot(s.axis*Math.PI/180),Ri=M.rot(-s.axis*Math.PI/180),A=M.mul(M.mul(R,M.diag(s.lambda1,s.lambda2)),Ri);return M.pow(A,s.echoCurrentN)}return M.mul(M.mul(M.rot(s.theta*Math.PI/180),M.shear(s.shear)),M.diag(s.sx,s.sy))}
function echoBase(){return M.mul(M.mul(M.rot(s.axis*Math.PI/180),M.diag(s.lambda1,s.lambda2)),M.rot(-s.axis*Math.PI/180))}
function mathState(){s.A=getA();return s.A}
function checkTask(task){const A= s.lv===5?M.pow(echoBase(),task.n):getA(),e=ellipseExtents(A,task.angle||0);const det=Math.abs(M.det(A));if(task.type==='harvest')return det>=task.minDet&&e.x>=task.minX;if(task.type==='shadow')return Math.abs(M.det(A))<.045&&e.x<=task.hw&&e.y<=task.hh;if(task.type==='echo')return e.x<=task.hw&&e.y<=task.hh&&e.x>=task.minX;return e.x<=task.hw&&e.y<=task.hh}
function indexUI(){const lvRow=$('levels');lvRow.innerHTML='';chapters.forEach((c,i)=>{const b=document.createElement('button');b.className='level'+(i===s.lv?' active':'')+(saved.cleared.includes(i)?' done':'');b.setAttribute('aria-label',`LEVEL ${i} ${c.name}`);b.innerHTML=`<div class="n">LEVEL ${i}</div><div class="name">${c.symbol} ${c.name}</div>`;b.onclick=()=>selectLevel(i);lvRow.appendChild(b)});$('doneCount').textContent=`${saved.cleared.length} / 6 発見`}
function initSelect(lv,showModal=true){s.runId++;$('pauseBtn').textContent='一時停止';s.lv=lv;s.scene='run';s.started=false;s.paused=false;s.blocked=false;s.t=0;s.idx=0;s.progress=0;s.current=null;s.fieldCollected=0;s.fieldHazards=0;s.fieldSpawnTime=0;s.fieldTotal=0;s.fieldDuration=0;s.particles=[];s.echoCurrentN=0;s.echoRunning=false;s.directA=null;s.sx=1;s.sy=1;s.theta=0;s.shear=0;s.order='SR';s.lambda1=1;s.lambda2=1;s.axis=0;s.fieldA=0;s.fieldB=0;s.collectedAt=null;s.shards=[];$('stageName').textContent=`LEVEL ${lv}｜${chapters[lv].name}`;$('stageSubtitle').textContent=chapters[lv].sub;$('briefText').textContent=chapters[lv].brief;$('stageCount').textContent=lv===3?'目標：光 ×5':`${tasks[lv].length}つの出来事`;$('gameFrame').classList.remove('hide');$('stageIntro').classList.remove('hide');$('controls').classList.remove('hide');$('brief').classList.remove('hide');$('bottomNav').classList.remove('hide');$('garden')?.remove();$('gardenDesc')?.remove();$('gardenPlayBtn')?.remove();indexUI();renderControls();updateAll();showHint(chapters[lv].tip,4600);if(showModal)modal('✨',`LEVEL ${lv}｜${chapters[lv].name}`,chapters[lv].brief+'\n\n操作方法は画面下に表示されるよ。失敗しても、何度でもその場でやり直せる。',[['あそびはじめる',()=>{if(lv===5){closeModal();showHint('固有値を決めて「この行列で3回の反復へ進む」を押そう。',3100)}else startLevel()},true],['別のレベルを見る',()=>{closeModal();s.started=false;},false]])}
function selectLevel(lv){closeModal();initSelect(lv,true)}
function startLevel(){closeModal();s.started=true;s.paused=false;s.blocked=false;if(s.lv===3){s.fieldDuration=0;s.particles=[];s.fieldTotal=0;s.fieldCollected=0;s.fieldHazards=0;s.fieldSpawnTime=0;} else if(s.lv===5){s.echoRunning=true;s.echoCurrentN=0;spawnTask();renderControls();}else{spawnTask()}updateAll()}
function spawnTask(){const task=tasks[s.lv]?.[s.idx];if(!task)return complete();s.current={...task,y:55,arrived:false};s.blocked=false;showHint(task.how,2600);updateAll()}
function progressTask(){if(!s.current)return;s.current=null;s.idx++;s.progress++;burst(CX,CY,26,'#bce7ff');s.collectedAt={t:s.t,y:CY};if(s.lv===5)s.echoCurrentN=s.idx;const id=s.runId;if(s.idx>=tasks[s.lv].length){s.current=null;setTimeout(()=>{if(id===s.runId)complete()},600)}else{setTimeout(()=>{if(id===s.runId&&s.started&&s.scene==='run')spawnTask()},850)}updateAll()}

function drawEchoForecast(){const base=echoBase();const cells=[{x:74,y:401},{x:196,y:401},{x:318,y:401}];for(let j=1;j<=3;j++){const A=M.pow(base,j);const e=ellipseExtents(A);const task=tasks[5][j-1],ok=checkTask(task);const x=cells[j-1].x,y=cells[j-1].y;g.fillStyle=ok?'rgba(99,202,177,.13)':'rgba(235,150,168,.13)';g.strokeStyle=ok?'#84dbc799':'#e8a3b494';g.lineWidth=1;g.fillRect(x-52,y-26,104,46);g.strokeRect(x-52,y-26,104,46);g.save();g.translate(x,y-2);g.scale(.47,.47);g.strokeStyle='#ccb9ff';g.beginPath();for(let k=0;k<36;k++){const z=TAU*k/36,p=[26*Math.cos(z),27*Math.sin(z)],xx=A[0]*p[0]+A[1]*p[1],yy=A[2]*p[0]+A[3]*p[1];if(k===0)g.moveTo(xx,yy);else g.lineTo(xx,yy)}g.closePath();g.stroke();g.restore();g.font='700 9px sans-serif';g.textAlign='center';g.fillStyle=ok?'#a8edce':'#ffc2d4';g.fillText(`A^${j} ${ok?'OK':'調整'}`,x,y+34)}}
function drawForeground(){const A=getA();if(s.lv===3)drawField();if(s.current)drawGate(s.current,s.current.y);drawBasis(A);
 const bob=(Math.abs(M.det(A))<.045?0:Math.sin(s.ambientT*2.6)*2);drawJelly(CX,CY+bob,A);
 if(s.lv===5&&!s.echoRunning)drawEchoForecast();if(s.lv===5&&s.echoRunning){const lv=s.echoCurrentN;g.fillStyle='#cee3fa';g.font='700 11px sans-serif';g.textAlign='center';g.fillText(`時間ステップ ${lv} / 3`,CX,357)}
 for(const p of s.shards){g.globalAlpha=Math.max(0,Math.min(1,p.life));g.fillStyle=p.color;g.beginPath();g.arc(p.x,p.y,2.4,0,TAU);g.fill()}g.globalAlpha=1;
 if(!s.started){g.fillStyle='rgba(12,17,35,.46)';g.fillRect(0,0,W,H);g.fillStyle='#ffffff';g.textAlign='center';g.font='800 19px sans-serif';g.fillText('準備ができたら、出発',CX,186);g.fillStyle='#c9d5f4';g.font='12px sans-serif';g.fillText('形も、周囲の流れも、数学で変わる',CX,211);if(s.lv!==5)g.font='700 12px sans-serif',g.fillText('下の操作を試してからスタートできるよ',CX,234)}
 if(s.paused&&s.started&&!s.blocked){g.fillStyle='rgba(6,12,27,.55)';g.fillRect(0,0,W,H);g.fillStyle='#eef5ff';g.font='800 21px sans-serif';g.textAlign='center';g.fillText('一時停止中',CX,205)}
}
function draw(){if(s.scene!=='run')return;g.clearRect(0,0,W,H);drawBackdrop();drawForeground()}
function spawnParticle(){const i=s.fieldTotal++,bad=(i%7===4||i%9===8),side=i%5;let x=[75,310,125,270,190][side]+Math.sin(i*1.9)*14;let y=30+(i%2)*-16;let vx=Math.sin(i*3)*5,vy=24+(i%4)*4;s.particles.push({x,y,vx,vy,bad})}
function updateField(dt){s.fieldDuration+=dt;s.fieldSpawnTime+=dt;if(s.fieldSpawnTime>.54&&s.fieldTotal<48){s.fieldSpawnTime=0;spawnParticle()}const a=s.fieldA,b=s.fieldB;
 for(const p of s.particles){const dx=(p.x-CX)/130,dy=(p.y-CY)/130,d=Math.hypot(dx,dy);const influence=Math.max(0,1-d/2.25);p.vx+=( (-a*dx-b*dy)*128*influence +(p.bad?12:0))*dt*1.1;p.vy+=( (b*dx-a*dy)*128*influence +22)*dt*1.1;p.vx*=Math.pow(.72,dt);p.vy*=Math.pow(.77,dt);p.x+=p.vx*dt;p.y+=p.vy*dt;
 if(Math.hypot(p.x-CX,p.y-CY)<30){p.dead=true;if(p.bad){s.fieldHazards++;s.fieldCollected=Math.max(0,s.fieldCollected-1);burst(CX,CY,10,'#ff91c0')}else{s.fieldCollected++;burst(CX,CY,9,'#abebfa')};updateAll()}
 if(p.y>H+20||p.x< -30||p.x>W+30)p.dead=true}
 s.particles=s.particles.filter(p=>!p.dead);if(s.fieldCollected>=5){complete();return}if(s.fieldDuration>42){s.started=false;s.paused=true;modal('💫','もう一回試そう',`光は ${s.fieldCollected} 個集まった。次は収束と回転の組み合わせを変えてみよう。`,[['もう一度',()=>{closeModal();initSelect(3,false);startLevel()},true],['別のレベルへ',()=>{closeModal();initSelect(4,true)},false]])}}
function animate(now){let dt=Math.min(.045,Math.max(0,(now-(s.frame||now))/1000));s.frame=now;s.ambientT+=dt*(s.started&&!s.paused&&!s.blocked?1:.26);for(const p of s.shards){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.life-=dt}s.shards=s.shards.filter(p=>p.life>0);
 if(s.scene==='run'&&s.started&&!s.paused&&!s.blocked){s.t+=dt;if(s.lv===3)updateField(dt);else if(s.current){s.current.y+=dt*(s.lv===5?64:69)*s.slow;if(s.current.y>=CY){if(checkTask(s.current)){progressTask()}else{s.current.y=CY;failGate()}}}}
 if(s.blocked&&s.current&&checkTask(s.current))resumeIfFit();draw();requestAnimationFrame(animate)}
function coords(ev){const r=cvs.getBoundingClientRect();return {x:(ev.clientX-r.left)/r.width*W,y:(ev.clientY-r.top)/r.height*H}}
function onDown(ev){if(s.scene!=='run'||s.lv>2)return;const p=coords(ev);const A=getA(),scale=42,ends=[{x:CX+A[0]*scale,y:CY+A[2]*scale},{x:CX+A[1]*scale,y:CY+A[3]*scale}];const idx=ends.map(v=>Math.hypot(p.x-v.x,p.y-v.y)).indexOf(Math.min(...ends.map(v=>Math.hypot(p.x-v.x,p.y-v.y))));if(Math.hypot(p.x-ends[idx].x,p.y-ends[idx].y)<29){s.drag=idx;cvs.setPointerCapture(ev.pointerId);ev.preventDefault()}}
function onMove(ev){if(s.drag===null)return;const p=coords(ev),A=getA(),v=[Math.max(-2.4,Math.min(2.4,(p.x-CX)/42)),Math.max(-2.4,Math.min(2.4,(p.y-CY)/42))];const m=[...A];if(s.drag===0)m[0]=v[0],m[2]=v[1];else m[1]=v[0],m[3]=v[1];// The actual basis columns are controlled directly; display matrix exactly as dragged.
 s.manualA=m;s.sx=Math.hypot(m[0],m[2]);s.sy=Math.hypot(m[1],m[3]);s.theta=Math.atan2(m[2],m[0])*180/Math.PI;s.shear=0; // reset shear approximation; use override until another control changes
 s.directA=m;updateAll();resumeIfFit();ev.preventDefault()}
function onUp(ev){if(s.drag!==null){s.drag=null;try{cvs.releasePointerCapture(ev.pointerId)}catch(e){}}}
// Sliders and presets change the same matrix; dragging changes its columns directly.
document.addEventListener('input',e=>{if(e.target.matches('#sx,#sy,#theta,#shear'))s.directA=null},true);
cvs.addEventListener('pointerdown',onDown);cvs.addEventListener('pointermove',onMove);cvs.addEventListener('pointerup',onUp);cvs.addEventListener('pointercancel',onUp);
$('pauseBtn').onclick=()=>{if(!s.started){if(s.lv!==5)startLevel();else{showHint('まず固有値を設定して「この行列で3回の反復へ進む」を押そう。',2000)}return} s.paused=!s.paused;$('pauseBtn').textContent=s.paused?'再開':'一時停止';updateAll()};
$('retryBtn').onclick=()=>{initSelect(s.lv,false);if(s.lv!==5)startLevel();else showHint('設定を整えてから反復を開始しよう',2500)};
$('gardenBtn').onclick=()=>showGarden();$('guideBtn').onclick=()=>modal('✦','この実験版について','6段階の数学操作を、Unlock待ちなしで全部試せる検証版。\n\nLEVEL 0〜2：生き物自身が行列 A で変形する。赤青の基底の端はドラッグ可能。\nLEVEL 3：粒子にベクトル場 F が作用する。\nLEVEL 4：S と R の順番で、最終形が変わる。\nLEVEL 5：Aⁿ が時間に応じて作用する。\n\nこれは「先のレベルに面白さがあるか」を確かめる試作。園芸・課金・長いUnlockは未搭載。',[['戻る',closeModal,true]]);
